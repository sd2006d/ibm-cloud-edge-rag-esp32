# Build context is the repository root, so the Dockerfile's COPY paths
# (cloud_microservice/, corpus/) resolve correctly. Keep the two files in sync.
services:
  rag-api:
    build:
      context: .
      dockerfile: cloud_microservice/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORPUS_DIR: /srv/corpus
      # WATSONX_API_KEY / WATSONX_PROJECT_ID intentionally unset: the
      # watsonx.ai backend stays inactive without real credentials.
